spring.application.name=gnomewars
# Only used when run locally with java -jar / spring-boot:run. On the Pi the WAR runs in the shared
# Tomcat (127.0.0.1:8090), which ignores this port.
server.port=4400
spring.config.import=optional:file:/opt/gnomewars/application-override.yaml

# Rotation caps for the app's own log file, so a runaway logger can never fill the Pi's disk.
# Inert until logging.file.name is set — the Pi sets it in application-override.yaml; in dev the app
# logs to the console only.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.clean-history-on-start=true
