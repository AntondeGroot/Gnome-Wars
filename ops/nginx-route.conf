# Gnome Wars' route on the Pi, installed by scripts/deploy.sh as /etc/nginx/app-routes/gnomewars.conf.
#
# Included inside GameRoom's server block (GWT_GameRoom/nginx.conf). It is a file of its own rather
# than a block in GameRoom's file because GameRoom's setup-pi.sh copies that file over the Pi's.
#
# gnomewars.war runs in the shared Tomcat (GWT_GameRoom/setup-tomcat.sh) at context path /gnomewars,
# so the prefix is kept rather than stripped.
location /gnomewars/ {
    proxy_pass http://127.0.0.1:8090/gnomewars/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare Tunnel reaches nginx over plain HTTP; pass on the scheme Cloudflare saw.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
}
