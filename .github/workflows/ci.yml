name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The job id must stay `ci`: the `protectMain` ruleset requires a status check with that name.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      # The generator downloads its jar from Maven Central into node_modules, which npm ci has just
      # wiped. Central rate-limits GitHub's shared runners (HTTP 429), so keep the jar between runs.
      # After npm ci, or it would delete the restored jar again.
      - name: Cache OpenAPI generator jar
        uses: actions/cache@v6
        with:
          path: client/node_modules/@openapitools/openapi-generator-cli/versions
          key: openapi-generator-jar-${{ hashFiles('client/openapitools.json') }}

      # openapi-generator is lenient and turns a malformed spec into silently wrong code, so lint the
      # spec before anything is generated from it.
      - name: Lint OpenAPI spec
        run: npm run lint:openapi
        working-directory: client

      # Generated code is gitignored, so every clean checkout regenerates it from the spec.
      - name: Generate API client
        run: npm run generate
        working-directory: client

      - name: Test client
        run: npm test -- --watch=false
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      # Generates the server interfaces from the same spec, compiles against them and runs the tests.
      - name: Build and test server
        run: mvn -B clean verify --file server/pom.xml
